# Postgres + Airflow on your laptop.
#   docker compose up -d --build        start (first build takes a few minutes)
#   docker compose exec airflow bash    open a shell inside the Airflow container
#   docker compose down                 stop (data is kept in the pgdata volume)
# Airflow UI: http://localhost:8080  (login: docker compose logs airflow | grep -i password)
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: audience
    ports:
      - "5432:5432"            # so Power BI / DBeaver on your laptop can connect
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

  airflow:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/project/airflow/dags
      PROJECT_DIR: /opt/project
      PGHOST: postgres          # the service name above, not localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: audience
    volumes:
      - .:/opt/project          # the project folder, live inside the container
    working_dir: /opt/project
    ports:
      - "8080:8080"
    command: standalone

volumes:
  pgdata:
